spring:
  application:
    name: schoolmanagement
  main:
    banner-mode: off
  data:
    mongodb:
      # Default is the local docker compose replica set. A real connection string belongs in the
      # environment (or in the untracked .env the local profile imports), never in this file.
      uri: ${MONGODB_URI:mongodb://localhost:27017/school?replicaSet=rs0&directConnection=true}
      # Indexes are declared in code with @Indexed/@CompoundIndex, so let Spring Data create them.
      auto-index-creation: true
      uuid-representation: standard
    web:
      pageable:
        # API_CONTRACT.md §1: page is 0-based and size is at most 100. Enforced here rather than in
        # every controller, so no list endpoint can be talked into returning the whole collection.
        default-page-size: 20
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Exam papers are capped at 20 MB by the vault itself (B14); this is the hard transport limit.
      max-file-size: 25MB
      max-request-size: 30MB
  threads:
    virtual:
      enabled: true
  ai:
    model:
      # Every one of Spring AI's OpenAI auto-configurations is off, deliberately and in every
      # deployment. Each asserts a non-empty spring.ai.openai.api-key while the context is built, so
      # leaving any of them on would stop a school that has AI switched off from starting at all.
      # AiModelConfig builds the chat model from app.ai.* instead, and only when app.features.ai is
      # true. Chat is also the only one B18 uses: this application does not generate images, speech,
      # transcriptions or embeddings, so the rest would only be beans waiting to break a startup.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${SERVER_PORT:8080}
  # Honour the X-Forwarded-* headers the hosting proxy sets, which every deployment of this has in
  # front of it (Railway, Nginx). Two things break without it, both because the application believes
  # it is being reached on plain http at its internal address:
  #   - the OpenAPI document advertises `http://host` as its server, so Swagger UI — loaded over
  #     https — cannot call it at all and every Try-it-out ends in "Failed to fetch";
  #   - getRemoteAddr() is the proxy, so the whole internet shares one rate-limit bucket in
  #     ChatRateLimiter.
  # `framework` is Spring's own ForwardedHeaderFilter rather than Tomcat's valve, so it behaves the
  # same whatever container this runs in. It is a no-op locally, where nothing sends the headers.
  # Set it to `none` only if this is ever exposed without a proxy in front: the headers are then the
  # client's to forge.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  error:
    whitelabel:
      enabled: false
  shutdown: graceful
  # Hardened further in B19.
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 30MB

app:
  api-base-path: /api/v1
  school-code: ${SCHOOL_CODE:DEMO}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  features:
    ai: ${APP_FEATURES_AI:false}
  jwt:
    # Must be overridden per deployment; startup fails fast in B2 if it is left at the dev value.
    secret: ${JWT_SECRET:change-me-in-every-deployment-this-is-a-dev-only-secret}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
    cookie-path: /api/v1/auth
    # Secure by default; the local profile turns it off because it serves plain http.
    cookie-secure: ${JWT_COOKIE_SECURE:true}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:school-media}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    region: ${STORAGE_REGION:us-east-1}
    public-prefix: public/
    path-style-access: true
    # Where public objects are read from. Empty means endpoint/bucket, which is what MinIO serves
    # locally; in production set it to the R2 custom domain or public bucket URL.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    max-image-size: ${STORAGE_MAX_IMAGE_SIZE:5MB}
    max-attachment-size: ${STORAGE_MAX_ATTACHMENT_SIZE:10MB}
    max-paper-size: ${STORAGE_MAX_PAPER_SIZE:20MB}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  encryption:
    # Base64 AES-256 key for employee bank details (B6).
    key: ${ENCRYPTION_KEY:}
  ai:
    # Only read when app.features.ai is true (B18). A deployment with AI switched off needs no key
    # and must still start, which is why the chat model is built by the ai module rather than by
    # Spring AI's own auto-configuration — see spring.ai.model.chat below.
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout: ${AI_TIMEOUT:30s}
  seed:
    # First boot loads school_config from the bundled seed for this profile: school or college
    # (seed/school-seed.json or seed/college-seed.json).
    enabled: ${APP_SEED_ENABLED:true}
    profile: ${SEED_PROFILE:school}
    # Wins over the profile when set. Any Spring resource location works; point it at
    # file:./seed/school-seed.json to change a deployment's seed without rebuilding.
    school-config-location: ${APP_SEED_SCHOOL_CONFIG:}
  demo-data:
    # The one-time demonstration data set (B20). Off means /admin/demo-data does not exist, which is
    # what a school's own deployment runs: the seeder writes a year of fees, payments and payroll.
    enabled: ${DEMO_DATA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mongo:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.school: INFO
